<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>DM's Notebook</title>
        
        <link rel="stylesheet" href="style.css">
        <script src="npcs.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Dungeon Master's Notebook</h1>
            <p>A little corner for adventures.</p>
        </header>

        <main>
            <section class="npc-section">
                <div class="section-header">
                    <h2>My NPCs</h2>
                    <button id="add-npc-btn" type="button">
                        + Add NPC
                    </button>
                </div>
    
                <!-- NPC cards will be generated by JavaScript -->
                <div id="npc-container"></div>
            </section>
        </main>

        <footer>
            <p>DM's Notebook — Made for adventures around the table.</p>
        </footer>
    </body>
</html>
