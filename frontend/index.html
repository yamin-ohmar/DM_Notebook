
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DM's Notebook - My Campaigns</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>DM's Notebook</h1>
        <p>Your adventures, organised in one place.</p>
    </header>

    <main>
        <section class="campaign-form-section">
            <h2>Create a Campaign</h2>
            <p>Start a new adventure by giving your campaign a name.</p>

            <form id="create-campaign-form">
                <div class="form-group">
                    <label for="campaign-name">Campaign Name *</label>
                    <input
                        type="text"
                        id="campaign-name"
                        placeholder="e.g. The Keep on the Borderlands"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="campaign-description">Description (optional)</label>
                    <textarea
                        id="campaign-description"
                        rows="3"
                        placeholder="What's your adventure about?"
                    ></textarea>
                </div>

                <button type="submit">Create Campaign</button>
            </form>

            <p id="campaign-form-message" role="status"></p>
        </section>

        <section>
            <h2>My Campaigns</h2>
            <p>Select a campaign to explore your adventures.</p>

            <!-- Campaign cards will be inserted here -->
            <div id="campaign-list"></div>
        </section>
    </main>

    <script src="/script.js"></script>
</body>
</html>
